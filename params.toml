# sPAR crypto parameters — the single source of truth.
#
# Read at RUNTIME by both
#   libs/utils/src/params.cpp          the C++ factory
#   scripts/estimate-security-param.py the lattice-estimator security check
# Change a value and re-run. No rebuild required.
#
#   SPAR_PARAMS=<name>       select the active set (default: "standard")
#   SPAR_PARAMS_FILE=<path>  override this file's location (default: baked in at
#                            configure time as an absolute path)

## Default parameters (table 4.1)
## 132.5-bit security
[standard]

plaintext_modulus = 65537   # Plaintext modulus t. NTT-friendly at N = 2^14, so SIMD packing works.
ring_dim = 16384            # Ring dimension N.

# Total RNS limbs in Q. OpenFHE's multiplicativeDepth is DERIVED from this at
# runtime, so one set serves both modes at the same |Q|:
#   single-party  depth = limbs - 1
#   multiparty    depth = limbs - 3   (NOISE_FLOODING_MULTIPARTY inserts two extra
#                                      60-bit primes; OpenFHE NUM_MODULI_MULTIPARTY)
limbs = 7

# Bits in q_0 and in every subsequent q_i.  |Q| = 60 + (6-1)*60 = 360 bits.
# Keep scaling_mod_size = 60: OpenFHE's multiparty flooding primes are always
# MULTIPARTY_MOD_SIZE = 60 bits, so any other value makes |Q| differ between the
# two modes and invalidates the estimator's logQ derivation.
first_mod_size = 60
scaling_mod_size = 60

# Absolute error stddev. 1-to-1 with OpenFHE SetStandardDeviation() and with the
# estimator's Xe = DiscreteGaussian(stddev=...).
standard_deviation = 3.19

# BV gadget digit count: `a` is decomposed into `ell` digits. Larger ell means
# less noise and linearly more work. Ignored by the hybrid gadget, which
# decomposes per RNS limb instead.
ell = 2

# "bv" | "hybrid". Selects the gadget used by MakeContext(), and tells the
# estimator whether the attacker sees Q (bv) or QP (hybrid).
scheme = "bv"

## Double ring dimension to achieve approximate parity between security
## in BV and Hybrid gadgets (hybrid is slightly more secure with double
## N and double effective Q)
## 132.5-bit security
[hybrid-N]
plaintext_modulus = 65537
ring_dim = 32768
limbs = 7
first_mod_size = 60
scaling_mod_size = 60
standard_deviation = 3.19
ell = 2
scheme = "hybrid"

## Security parity by halving Q
## 114.4-bit security
[hybrid-Q]
plaintext_modulus = 65537
ring_dim = 16384
limbs = 4
first_mod_size = 60
scaling_mod_size = 60
standard_deviation = 3.19
ell = 2
scheme = "hybrid"

## Test with smaller plaintext modulus t, since BGV scales the error by t
## 131.5-bit security
[small-t]
plaintext_modulus = 256
ring_dim = 16384
limbs = 7
first_mod_size = 60
scaling_mod_size = 60
standard_deviation = 3.19
ell = 2
scheme = "bv"

## Standard with larger decomposition parameter to investigate noise growth
[ell-3]
plaintext_modulus = 65537
ring_dim = 16384
limbs = 7
first_mod_size = 60
scaling_mod_size = 60
standard_deviation = 3.19
ell = 3
scheme = "bv"

## Standard with even larger decomposition parameter to investigate noise growth
[ell-4]
plaintext_modulus = 65537
ring_dim = 16384
limbs = 7
first_mod_size = 60
scaling_mod_size = 60
standard_deviation = 3.19
ell = 4
scheme = "bv"